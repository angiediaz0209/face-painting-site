    <!-- Structured data: who we are, where we work, what people ask us.

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "Face Painting California",
        "url": "https://face-painting-site.vercel.app/",
        "telephone": "+14159919374",
        "priceRange": "$$",
        "image": "https://face-painting-site.vercel.app/og-image.jpg",
        "areaServed": [
          { "@type": "AdministrativeArea", "name": "Marin County, CA" },
          { "@type": "City", "name": "San Francisco, CA" },
          { "@type": "City", "name": "Santa Rosa, CA" }
        ],
        "description": "Professional face painting for birthday parties, festivals, school events and corporate events, serving Marin County, San Francisco and Santa Rosa."
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What kind of paints do you use?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "We use only professional, FDA-compliant, water-based face paints that are completely safe for kids and adults. They wash off easily with soap and water."
            }
          },
          {
            "@type": "Question",
            "name": "How far in advance should I book?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "We recommend booking at least 2 weeks in advance, especially for weekends. Popular dates fill up fast."
            }
          },
          {
            "@type": "Question",
            "name": "How many kids can you paint per hour?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "One artist can paint about 10-12 kids per hour with detailed designs, or more with simpler designs. For larger groups, we recommend adding a second artist."
            }
          },
          {
            "@type": "Question",
            "name": "What areas do you serve?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "We serve Marin County (free travel), San Francisco, and Santa Rosa. Travel fees apply for San Francisco and Santa Rosa."
            }
          },
          {
            "@type": "Question",
            "name": "What if it rains or we need to cancel?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Plans change. Clients can reach out to reschedule and Face Painting California tries to stay flexible."
            }
          },
          {
            "@type": "Question",
            "name": "Do you paint adults too?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Adults love face painting just as much as kids, at corporate events, private parties, and festivals."
            }
          }
        ]
      }
    </script>
